# ClawVault docker-compose（fnOS 标准 Docker 应用布局：app/docker/docker-compose.yaml）
# 构建上下文设到 app/docker/..（即 app/），这样 Dockerfile 能直接 COPY app/{backend,frontend}
# 由 cmd/main 调 docker compose up -d --build 启动
services:
  clawvault:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: clawvault:1.0.3
    container_name: clawvault
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT:-6789}:6789"
    environment:
      - PORT=6789
      - ARCHIVE_ROOT=/archive
      - DATA_DIR=/data
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.anthropic.com}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-5}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - ${TRIM_PKGVAR}:/data
      - ${TRIM_DATA_SHARE:-../../archive}:/archive
