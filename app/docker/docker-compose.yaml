# ClawVault docker-compose（fnOS 标准 Docker 应用布局）
# 由 cmd/main 调 docker compose up -d --build 启动
# 构建上下文设为 ..（即 app/），Dockerfile 在 ../docker/ 下，这样 Docker 能用
# COPY backend/、COPY frontend/ 等相对路径（docker build context 禁止 COPY ../）
services:
  clawvault:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: "1.0.15"
    image: clawvault:1.0.15
    container_name: clawvault
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6789/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${TRIM_SERVICE_PORT:-6789}:6789"
    environment:
      - PORT=6789
      - ARCHIVE_ROOT=/archive
      - DATA_DIR=/data
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.anthropic.com}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-5}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - ${TRIM_PKGVAR}:/data
      - ${TRIM_DATA_SHARE:-../../archive}:/archive
