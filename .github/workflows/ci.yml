name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Node 22 是 fnOS 真机运行时（ABI 127），Node 24 为前向兼容版本。
    # ENG-4（v1.0.40）：better-sqlite3 已升级 11.10 → 12.11.1，其在 Node 24 V8 GC 压力下
    # 偶发原生中止（Assertion failed: (env) != nullptr）的问题已修复（本机 Node 24.19
    # 连跑 3 轮 139/139 全绿）。两个版本同为必过门禁，不再设 experimental。
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '22'
            experimental: false
          - node-version: '24'
            experimental: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: app/backend
        run: |
          # 可重现构建：package-lock.json 已与 package.json 同步（含 silk-wasm 等全部依赖），
          # 使用 npm ci 严格按 lockfile 安装，杜绝「package.json 漂移 + 自动拉取最新」带来的供应链风险。
          npm ci --no-audit --no-fund

      - name: Run tests
        continue-on-error: ${{ matrix.experimental }}
        working-directory: app/backend
        run: node --test tests/*.test.js
