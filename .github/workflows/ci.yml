name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: app/backend
        run: |
          # 使用 npm install 而非 npm ci：当前 package-lock.json 与 package.json
          # 不同步（缺少 silk-wasm），在本地网络可用时应执行 npm install 重新生成
          # lockfile 后再切换回 npm ci。此处先以 npm install 保证 CI 能安装完整依赖。
          for i in 1 2 3; do
            npm install --no-audit --no-fund && break
            echo "npm install attempt $i failed, retrying..."
            sleep 5
          done

      - name: Run tests
        working-directory: app/backend
        run: node --test tests/*.test.js
