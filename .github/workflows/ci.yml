name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Node 22 是 fnOS 真机运行时（ABI 127，better-sqlite3 11.10 稳定），作为必过门禁；
    # Node 24 标记为 experimental：better-sqlite3 11.10 在 Node 24 的 V8 GC 压力下会偶发原生中止
    # （Assertion failed: (env) != nullptr，Statement::~Statement），属第三方原生模块与 Node 24 的
    # 兼容问题，非业务代码回归（storage.js 已全部走 _stmt() 缓存、无即用即弃 Statement）。
    # 该项 continue-on-error，失败不阻断发版门禁，仅作前向兼容信号。
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '22'
            experimental: false
          - node-version: '24'
            experimental: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: app/backend
        run: |
          # 可重现构建：package-lock.json 已与 package.json 同步（含 silk-wasm 等全部依赖），
          # 使用 npm ci 严格按 lockfile 安装，杜绝「package.json 漂移 + 自动拉取最新」带来的供应链风险。
          npm ci --no-audit --no-fund

      - name: Run tests
        continue-on-error: ${{ matrix.experimental }}
        working-directory: app/backend
        run: node --test tests/*.test.js
