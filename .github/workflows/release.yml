name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm install --no-audit --no-fund

      - name: Build fpk
        run: |
          set -euo pipefail
          bash scripts/prepare-runtime.sh
          bash scripts/build-fpk.sh --check

      - name: Read version from manifest
        id: ver
        run: |
          VER="$(grep '^version=' manifest | head -1 | cut -d= -f2)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd dist-fpk
          sha256sum "clawvault_${{ steps.ver.outputs.version }}_x86_64.fpk" > "clawvault_${{ steps.ver.outputs.version }}_x86_64.fpk.sha256"
          cat "clawvault_${{ steps.ver.outputs.version }}_x86_64.fpk.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: ClawVault v${{ steps.ver.outputs.version }}
          files: |
            dist-fpk/clawvault_${{ steps.ver.outputs.version }}_x86_64.fpk
            dist-fpk/clawvault_${{ steps.ver.outputs.version }}_x86_64.fpk.sha256
          generate_release_notes: true
