services:
  clawvault:
    build:
      context: .
      dockerfile: Dockerfile
    image: clawvault:1.0.39
    container_name: ClawVault
    restart: unless-stopped
    # SEC-13：容器加固——根文件系统只读、去除所有 capabilities、禁止提权。
    # 应用只写 /data 与 /archive（均为挂载卷），临时文件走 tmpfs。
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORT:-6789}:6789"
    environment:
      - PORT=6789
      - ARCHIVE_ROOT=${ARCHIVE_ROOT:-/archive}
      - DATA_DIR=/data
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.anthropic.com}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-5}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - clawvault-data:/data
      - ${ARCHIVE_HOST:-./archive}:/archive
    networks:
      - clawvault-net

volumes:
  clawvault-data:

networks:
  clawvault-net:
    driver: bridge
